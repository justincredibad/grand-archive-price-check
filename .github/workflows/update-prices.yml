name: Update card prices

on:
  schedule:
    # 04:00 UTC daily (~11 PM/12 AM US Eastern, ~12 PM Singapore)
    - cron: "0 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch-prices.mjs"
      - "scripts/build-pokemon-insights.mjs"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest card prices
        run: node scripts/fetch-prices.mjs

      - name: Build Pokemon price-pattern insights
        run: node scripts/build-pokemon-insights.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update card prices"
            git push
          fi
